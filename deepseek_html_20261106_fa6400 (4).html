function drawParticles(){
  const isBoss = LEVELS[G.levelIdx].type === 'boss';
  for (const p of G.particles){
    const x = p.x - (isBoss ? 0 : G.camX), y = p.y - (isBoss ? 0 : G.camY);
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function drawPlayer(){
  const isBoss = LEVELS[G.levelIdx].type === 'boss';
  const px = isBoss ? G.player.x + PLAYER.w/2 : (G.player.x - G.camX + PLAYER.w/2);
  const py = isBoss ? G.player.y + PLAYER.h : (G.player.y - G.camY + PLAYER.h);
  if (G.player.invuln > 0 && Math.floor(G.time*20) % 2 === 0) return;
  if (G.player.onGround && !isBoss){ ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(px, py+4, PLAYER.w*0.5, 4, 0, 0, Math.PI*2); ctx.fill(); }
  const skin = ALL_SKINS.find(s => s.id === selectedSkin) || CREATURE_SKINS[0];
  let glowColor = '#ff7b3a';
  if (skin.id === 'kraken') glowColor = '#7a3ab0'; else if (skin.id === 'bee') glowColor = '#ffd93a'; else if (skin.id === 'volcano') glowColor = '#ff5522'; else if (skin.id === 'earth') glowColor = '#1e90ff'; else if (skin.id === 'spider') glowColor = '#a020a0';
  ctx.shadowColor = glowColor; ctx.shadowBlur = 20; drawSkin(ctx, px, py, G.time, selectedSkin); ctx.shadowBlur = 0;
}

function drawHint(){
  const type = LEVELS[G.levelIdx].type;
  let text = '';
  if (type === 'awakening'){ if (G.sub === 'intro') text = 'ПРИЦЕЛЬСЯ МЫШЬЮ · КЛИК — БРОСИТЬ КАМЕНЬ'; else if (G.sub === 'cageOpen') text = 'НАЖМИ E ЧТОБЫ ОТКРЫТЬ КЛЕТКУ'; }
  else if (type === 'puzzles') text = 'ПОДОЙДИ К СИМВОЛУ И НАЖМИ E';
  else if (type === 'lab') text = 'ПРОЙДИ ПАРКУР → ВОЗЬМИ КОЛБУ → 3 РАЗА → ФУТЛЯР (E)';
  else if (type === 'boss'){
    if (G.boss.phase === 'attack'){
      text = G.boss.wave >= 4 ? 'WASD + ПРОБЕЛ · УКЛОНЯЙСЯ ОТ ВОЛН И ШИПОВ' : 'УКЛОНЯЙСЯ МЫШЬЮ!';
    } else {
      text = 'ПОЙМАЙ ЖЁЛТУЮ ПУЛЮ';
    }
  }
  else if (type === 'return') text = G.sub === 'chase' ? 'БЕГИ!' : 'WASD — ДВИЖЕНИЕ · ПРОБЕЛ — ПРЫЖОК';
  else text = 'WASD — ДВИЖЕНИЕ · ПРОБЕЛ — ПРЫЖОК · E — ВЗАИМОДЕЙСТВИЕ';
  if (text && !G.miniGame){ ctx.font = '13px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(200,150,150,0.7)'; ctx.fillText(text, W/2, H - 40); }
}

function drawToast(){
  if (!G.toast) return;
  const alpha = Math.min(1, G.toast.timer * 2);
  ctx.globalAlpha = alpha; ctx.font = 'bold 22px system-ui'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffdd00'; ctx.shadowColor = '#ffdd00'; ctx.shadowBlur = 20;
  ctx.fillText(G.toast.text, W/2, H*0.75); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

function drawBossModeMessage(){
  if (!G.bossModeMessage) return;
  const alpha = Math.min(1, G.bossModeMessage.timer);
  ctx.globalAlpha = alpha;
  ctx.font = 'bold 26px system-ui'; ctx.textAlign = 'center';
  ctx.fillStyle = '#9dff5e'; ctx.shadowColor = '#9dff5e'; ctx.shadowBlur = 30;
  ctx.fillText(G.bossModeMessage.text, W/2, H*0.2);
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (G.screen !== 'play'){
    const grad = ctx.createRadialGradient(W/2, H*0.5, 0, W/2, H*0.5, Math.max(W,H)*0.8);
    grad.addColorStop(0, '#1a0410'); grad.addColorStop(1, '#050308');
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
    if (G.screen === 'credits'){ for (let i=0;i<30;i++){ const x = ((i*137 + G.time*20) % W); const y = (H - ((G.time*30 + i*50) % H)); ctx.fillStyle = `rgba(255,80,20,${0.2 + Math.sin(G.time+i)*0.2})`; ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fill(); } }
    return;
  }
  drawBackground();
  ctx.save();
  if (G.shake > 0.1) ctx.translate((Math.random()-0.5)*G.shake, (Math.random()-0.5)*G.shake);
  const type = LEVELS[G.levelIdx].type;
  if (type === 'boss') drawBoss();
  else { drawPlatforms(); drawHazards(); drawKeys(); drawDoors(); drawGoal(); if (type === 'awakening') drawAwakeningSpecial(); if (type === 'return') drawReturnSpecial(); if (type === 'puzzles') drawPuzzlesSpecial(); if (type === 'lab') drawLabSpecial(); }
  drawParticles(); drawPlayer();
  if (G.sub === 'chase' && type === 'awakening' && G.ptero && G.ptero.active) drawPterodactyl(G.ptero.x - G.camX, G.ptero.y - G.camY, 0);
  ctx.restore();
  drawHint(); drawToast(); drawBossModeMessage();
  if (G.flash > 0){ ctx.fillStyle = G.flashColor; ctx.globalAlpha = G.flash * 0.1; ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1; }
  if (G.miniGame) drawMiniGame();
}

const pressedCodes = {};
window.addEventListener('keydown', e => {
  const code = e.code;
  switch (code){
    case 'KeyW': case 'ArrowUp': case 'Space': e.preventDefault(); if (!pressedCodes[code]) G.input.jumpPressed = true; G.input.jump = true; pressedCodes[code] = true; break;
    case 'KeyA': case 'ArrowLeft': e.preventDefault(); G.input.left = true; pressedCodes[code] = true; break;
    case 'KeyD': case 'ArrowRight': e.preventDefault(); G.input.right = true; pressedCodes[code] = true; break;
    case 'KeyE': if (!pressedCodes[code]) G.input.actionPressed = true; G.input.action = true; pressedCodes[code] = true; break;
    case 'Escape': case 'KeyP': if (G.screen === 'play' || G.screen === 'pause') togglePause(); break;
  }
}, true);
window.addEventListener('keyup', e => {
  const code = e.code;
  switch (code){
    case 'KeyW': case 'ArrowUp': case 'Space': G.input.jump = false; pressedCodes[code] = false; break;
    case 'KeyA': case 'ArrowLeft': G.input.left = false; pressedCodes[code] = false; break;
    case 'KeyD': case 'ArrowRight': G.input.right = false; pressedCodes[code] = false; break;
    case 'KeyE': G.input.action = false; pressedCodes[code] = false; break;
  }
}, true);
window.addEventListener('blur', () => { G.input.left = G.input.right = G.input.jump = G.input.action = false; for (const k in pressedCodes) pressedCodes[k] = false; });

canvas.addEventListener('mousemove', e => {
  G.mouse.x = e.clientX; G.mouse.y = e.clientY;
  if (LEVELS[G.levelIdx].type === 'boss' && G.boss){
    G.boss.mouseX = e.clientX;
    G.boss.mouseY = e.clientY;
  }
});
canvas.addEventListener('mousedown', e => {
  G.mouse.down = true; G.mouse.clicked = true;
  if (LEVELS[G.levelIdx].type === 'boss' && G.boss){
    G.boss.mouseX = e.clientX; G.boss.mouseY = e.clientY;
  }
  if (G.miniGame) handleMiniGameMouseDown(e.clientX, e.clientY);
});
canvas.addEventListener('mouseup', e => {
  G.mouse.down = false;
  if (G.miniGame) handleMiniGameClick(e.clientX, e.clientY);
});

function buildLevelGrid(){
  const grid = $('levelGrid'); grid.innerHTML = '';
  const progress = +(localStorage.getItem('neon2_progress') || 0);
  for (let i=0;i<LEVELS.length;i++){
    const btn = document.createElement('button');
    btn.className = 'lvl-btn';
    if (i > progress) btn.classList.add('locked'); else if (i < progress) btn.classList.add('done'); else btn.classList.add('current');
    if (i === LEVELS.length - 1) btn.classList.add('boss');
    btn.textContent = i + 1;
    const title = document.createElement('span'); title.className = 'lvl-title'; title.textContent = LEVELS[i].name; btn.appendChild(title);
    if (i <= progress) btn.onclick = () => { hideOverlays(); initLevel(i); }; else btn.disabled = true;
    grid.appendChild(btn);
  }
}

function buildSkinsGrid(){
  const grid = $('skinsGrid'); grid.innerHTML = '';
  for (const skin of ALL_SKINS){
    const btn = document.createElement('button'); btn.className = 'skin-btn'; if (skin.id === selectedSkin) btn.classList.add('selected');
    const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; const c2 = cv.getContext('2d');
    c2.save(); c2.translate(30, 55); c2.scale(1.2, 1.2); const w = 26, h = 40;
    if (skin.type === 'creature') drawCreatureSkin(c2, -w/2, -h, w, h, skin.id, 0); else drawFlagSkin(c2, -w/2, -h, w, h, skin, 0);
    c2.fillStyle = '#0f1a06'; c2.beginPath(); c2.arc(-w*0.18, -h*0.78, 2.2, 0, Math.PI*2); c2.fill(); c2.beginPath(); c2.arc(w*0.18, -h*0.78, 2.2, 0, Math.PI*2); c2.fill(); c2.restore();
    btn.appendChild(cv);
    const label = document.createElement('div'); label.textContent = skin.name; btn.appendChild(label);
    btn.onclick = () => { selectedSkin = skin.id; localStorage.setItem('neon2_skin', skin.id); buildSkinsGrid(); };
    grid.appendChild(btn);
  }
}

function hideOverlays(){ ['menu','storyScreen','skinsScreen','pauseScreen','winScreen','failScreen','creditsScreen'].forEach(id => $(id).classList.add('hidden')); $('creditsSkipBtn').style.display = 'none'; $('pauseBtn').style.display = 'none'; }

function showMenu(){ hideOverlays(); $('menu').classList.remove('hidden'); buildLevelGrid(); G.screen = 'menu'; stopMusic(); }
function showWin(){ G.screen = 'win'; hideOverlays(); $('winScreen').classList.remove('hidden'); stopMusic(); }
function showFail(){ G.screen = 'fail'; hideOverlays(); $('failScreen').classList.remove('hidden'); stopMusic(); }

function togglePause(){
  if (G.screen === 'play'){ G.screen = 'pause'; $('pauseScreen').classList.remove('hidden'); pauseMusic(); }
  else if (G.screen === 'pause'){ G.screen = 'play'; $('pauseScreen').classList.add('hidden'); resumeMusic(); }
}

function showCredits(){ G.screen = 'credits'; G.creditsTimer = 0; hideOverlays(); $('creditsScreen').classList.remove('hidden'); ['cTitle','cSub','cLine1','cLine2','cLine3','cContinue'].forEach(id => { const el = $(id); if (el) el.classList.remove('visible'); }); stopMusic(); startMusicUrl(CREDITS_MUSIC); }

function updateCredits(dt){
  G.creditsTimer += dt;
  const delays = [0.3, 1.5, 2.8, 4.5, 6.5, 9.5];
  const ids = ['cTitle','cSub','cLine1','cLine2','cLine3','cContinue'];
  for (let i=0;i<ids.length;i++){ if (G.creditsTimer >= delays[i]){ const el = $(ids[i]); if (el) el.classList.add('visible'); } }
  if (G.creditsTimer > 3 && $('creditsSkipBtn').style.display === 'none') $('creditsSkipBtn').style.display = 'block';
}

$('skinsBtn').onclick = () => { hideOverlays(); $('skinsScreen').classList.remove('hidden'); buildSkinsGrid(); G.screen = 'skins'; };
$('skinsBackBtn').onclick = () => showMenu();
$('pauseBtn').onclick = () => togglePause();
$('resumeBtn').onclick = () => togglePause();
$('restartBtn').onclick = () => { hideOverlays(); initLevel(G.levelIdx); };
$('pauseMenuBtn').onclick = () => showMenu();
$('retryFailBtn').onclick = () => { hideOverlays(); initLevel(G.levelIdx); };
$('menuFailBtn').onclick = () => showMenu();
$('nextBtn').onclick = () => { const next = G.levelIdx + 1; if (next < LEVELS.length){ hideOverlays(); initLevel(next); } else showCredits(); };
$('menuWinBtn').onclick = () => showMenu();
$('creditsSkipBtn').onclick = () => showMenu();

function layout(){ DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR); canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; }
window.addEventListener('resize', () => {
  layout();
  if (LEVELS[G.levelIdx] && LEVELS[G.levelIdx].type === 'boss' && G.boss){
    const aw = Math.min(W*0.85, 900); const ah = Math.min(H*0.55, 460);
    G.boss.arena = { x:(W-aw)/2, y:H*0.28, w:aw, h:ah };
  }
});

let lastT = performance.now();
function loop(t){
  const dt = Math.min(0.033, (t - lastT) / 1000); lastT = t;
  update(dt); draw();
  G.input.jumpPressed = false; G.input.actionPressed = false; G.mouse.clicked = false;
  $('pauseBtn').style.display = (G.screen === 'play') ? 'flex' : 'none';
  requestAnimationFrame(loop);
}

layout();
showMenu();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
